<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="لوحتي">
<title>لوحة التحكم الموحّدة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--surface:#ffffff;--s2:#f0f2f5;--s3:#e7eaef;--border:#e4e7ec;--border2:#d3d8df;--ink:#151b24;--sub:#5d6675;--faint:#8b93a1;--tint:var(--gc,#2b7cd9);--ok:#15803d;--warn:#b45309;--bad:#dc2626;--gt:color-mix(in srgb,var(--gc,#3b9de8) 14%,var(--bg));--g2:var(--s2);--r:12px;--rs:9px;--ring:0 0 0 3px color-mix(in srgb,var(--tint) 22%,transparent);--sh:0 1px 2px rgba(15,23,42,.05);--sh-lg:0 12px 32px rgba(15,23,42,.14);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0e13;--surface:#12161d;--s2:#191f29;--s3:#232a36;--border:#232a36;--border2:#303a49;--ink:#e9ecf2;--sub:#9aa3b3;--faint:#6d7686;--tint:var(--gc,#58a6ff);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--gt:color-mix(in srgb,var(--gc,#3b9de8) 16%,var(--bg));--sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 14px 36px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0e13;--surface:#12161d;--s2:#191f29;--s3:#232a36;--border:#232a36;--border2:#303a49;--ink:#e9ecf2;--sub:#9aa3b3;--faint:#6d7686;--tint:var(--gc,#58a6ff);--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--gt:color-mix(in srgb,var(--gc,#3b9de8) 16%,var(--bg));--sh:0 1px 2px rgba(0,0,0,.4);--sh-lg:0 14px 36px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Tajawal",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--gt) 0%,var(--bg) 72%)}
html[data-grad=off] body::before{display:none}
::selection{background:color-mix(in srgb,var(--tint) 28%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
.g{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
button,.btn{font:inherit;color:var(--ink);border:1px solid var(--border);background:var(--surface);border-radius:var(--rs);min-height:38px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s,color .15s,transform .1s}
button:hover,.btn:hover{background:var(--s2);border-color:var(--border2)}
button:active,.btn:active{transform:scale(.98)}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--tint);outline-offset:1px}
.pri{background:var(--tint);color:#fff;border-color:transparent;font-weight:600}
.pri:hover{background:var(--tint);border-color:transparent;filter:brightness(1.07)}
.ib{width:34px;min-height:34px;padding:0;justify-content:center;border-radius:8px;background:transparent;border-color:transparent;color:var(--sub)}
.ib:hover{background:var(--s2);border-color:transparent;color:var(--ink)}
.bad{color:var(--bad)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
input,select,textarea{font:inherit;color:var(--ink);width:100%;min-height:40px;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--tint);box-shadow:var(--ring)}
textarea{min-height:90px}label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:12px 2px 5px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:calc(10px + env(safe-area-inset-top,0px)) 14px 0;padding:9px 12px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%);box-shadow:var(--sh)}
.top b{font-size:15px;font-weight:700}
.side{display:none}
.tabbar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;z-index:20;display:flex;padding:5px;border-radius:16px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:var(--sh-lg)}
.tabbar button,.side button{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;min-height:50px;border:0;background:transparent;color:var(--sub);padding:0;border-radius:11px}
.tabbar button .i{width:20px;height:20px}
.tabbar button:hover{color:var(--ink)}
.tabbar button.on{background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint);font-weight:700}
main{padding:14px 14px 110px;max-width:1680px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin:4px 2px 16px;flex-wrap:wrap}.hd h1{font-size:22px;font-weight:800;letter-spacing:-.3px}.hd p{color:var(--sub);font-size:13px;margin-top:2px}.hd .btn{margin-inline-start:auto}
.ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}.ico .i{width:20px;height:20px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{padding:14px 16px;border-radius:var(--r)}.kpi span{font-size:12px;font-weight:600;color:var(--sub)}.kpi b{display:block;font-size:24px;font-weight:700;margin-top:5px;letter-spacing:-.3px}.kpi small{display:block;font-size:12px;margin-top:4px;font-weight:500}
.card{padding:16px;margin-bottom:12px}.card h3{font-size:14.5px;font-weight:700;margin-bottom:12px}
.cols{display:grid;gap:12px;grid-template-columns:1fr}
.cbox{position:relative;height:220px}
.apps{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.ac{padding:15px 16px;cursor:pointer;display:flex;flex-direction:column;gap:13px;transition:border-color .15s,background .15s,transform .1s}
.ac:hover{border-color:var(--border2);background:color-mix(in srgb,var(--s2) 45%,var(--surface));transform:translateY(-1px)}
.ac:active{transform:none}
.ac:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.ac .t{display:flex;align-items:center;gap:11px}.ac .t b{font-size:14.5px}.ac small{color:var(--sub);display:block;font-size:12px;margin-top:1px}
.ac .chev{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex:none;transition:color .15s,background .15s}
.ac .chev .i{width:16px;height:16px}
.ac:hover .chev{color:var(--tint);background:color-mix(in srgb,var(--tint) 10%,transparent)}
.ac .v{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);padding-top:12px}
.ac .v div{padding-inline:12px;min-width:0}
.ac .v div:first-child{padding-inline-start:0}
.ac .v div+div{border-inline-start:1px solid var(--border)}
.ac .v b{font-size:18px;font-weight:700;display:block;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis}
.ac .v span{font-size:11px;color:var(--sub);display:block;margin-top:2px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.it{display:flex;align-items:center;gap:10px;padding:9px 8px;margin:0 -8px;border-bottom:1px solid var(--border);border-radius:8px;transition:background .12s}.it:hover{background:var(--s2)}.it:last-child{border:0}
.it .m{flex:1;min-width:0}.it .m b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .m small{color:var(--sub);font-size:12px}
.pill{font-size:11.5px;padding:2.5px 9px;border-radius:6px;font-weight:600;white-space:nowrap}.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.pill.n{background:var(--s2);color:var(--sub)}
.bar2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}.bar2 h3{margin:0}
.bl{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}.bl i{flex:1;height:7px;border-radius:4px;background:var(--s2);overflow:hidden}.bl i s{display:block;height:100%;background:var(--tint);border-radius:4px;min-width:2px}.bl b{font-size:12.5px}
.empty{text-align:center;color:var(--faint);padding:20px 10px;font-size:13px;border:1px dashed var(--border2);border-radius:10px;margin:2px 0}
.seg{display:flex;padding:3px;border-radius:9px;background:var(--s2);border:1px solid var(--border);gap:2px}.seg button{flex:1;border:0;background:transparent;min-height:32px;justify-content:center;color:var(--sub);font-size:13px;border-radius:7px}.seg button:hover{background:transparent;color:var(--ink)}.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.lc{width:100%;max-width:384px;padding:26px 24px;text-align:center;box-shadow:var(--sh-lg)}.lc h1{font-size:21px;margin-bottom:6px}.lc p{color:var(--sub);font-size:13.5px;margin-bottom:10px}.lc label{text-align:start}.lc button{width:100%;justify-content:center;margin-top:16px;min-height:44px;font-size:15px}
#lerr{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:18px}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,13,19,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;padding:0}
#sheet.on{display:flex}.sh{width:100%;max-width:520px;padding:20px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--sh-lg)}.sh h3{font-size:16px;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--border)}.sh .row{margin-top:16px}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-130px);padding:10px 16px;border-radius:10px;z-index:99;transition:transform .3s;font-size:13px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:8px}#toast.on{transform:translate(-50%,0)}#toast button{border:0;background:transparent}
.sk{height:76px;border-radius:12px;background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:sk 1.4s infinite}@keyframes sk{to{background-position:-200% 0}}
.gsw{flex:1;max-width:420px}.gsw input{min-height:36px;border-radius:9px;padding:6px 12px;font-size:13.5px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.qb{min-height:46px;border-radius:10px;padding:0 12px;justify-content:flex-start;gap:10px;font-weight:600;font-size:13.5px;background:var(--surface);border:1px solid var(--border);box-shadow:none}
.qb:hover{transform:none;border-color:var(--border2);background:var(--s2)}
.qi{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}.qi .i{width:16px;height:16px}
.duo{display:grid;gap:12px;grid-template-columns:1fr}.duo>.card{margin-bottom:12px}.wc{display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.wc .en{font-size:32px;font-weight:800;direction:ltr;letter-spacing:-.5px}.wc .ar{font-size:20px;font-weight:700;color:var(--tint);margin-top:4px}.wc .ex{direction:ltr;font-style:italic;color:var(--sub);margin-top:8px;font-size:13.5px}.wt{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:12.5px;margin:6px 0}
.popwrap{position:relative;flex:none}
.qamenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:40;min-width:264px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-lg);display:none}
.qamenu.on{display:block}
.pmh{font-size:11px;font-weight:700;color:var(--faint);padding:7px 10px 5px}
.pib{width:100%;justify-content:flex-start;gap:10px;border:0;background:transparent;border-radius:8px;min-height:42px;font-weight:600;padding:0 10px}
.pib:hover{background:var(--s2);border-color:transparent}
.pib small{margin-inline-start:auto;color:var(--faint);font-weight:500;font-size:11px}
.pit{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;font-size:12.5px;line-height:1.5}
.pit .pill{flex:none;margin-top:1px}
.pit span{flex:1;min-width:0}
.bigib{width:40px;min-height:40px;border-radius:11px;position:relative;padding:0;justify-content:center;flex:none}
.nbadge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.hact{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.smi{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 12px;min-height:66px;width:100%;text-align:start;font-weight:400;transition:border-color .15s,background .15s,transform .1s}
.smi:hover{border-color:var(--border2);background:color-mix(in srgb,var(--tint) 6%,var(--s2));transform:translateY(-1px)}
.smi:active{transform:none}
.smi .sicon{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none;transition:color .15s}
.smi:hover .sicon{color:var(--tint)}
.smi .sicon .i{width:17px;height:17px}
.smi div{min-width:0}
.smi span{display:block;font-size:11.5px;font-weight:600;color:var(--sub)}
.smi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.2px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.sumcard{display:flex;flex-direction:column}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.sumhint{font-size:11px;color:var(--faint);font-weight:500}
.hgrid{display:grid;gap:14px;grid-template-columns:1fr}
.hgrid>:only-child{grid-column:1/-1}
.apseg{max-width:560px;margin-bottom:14px}
@media(min-width:900px){.hgrid{grid-template-columns:1.8fr 1fr}}
.wbtns{display:flex;gap:8px;margin-top:12px}
.wbtns button{flex:1;justify-content:center;min-height:38px;font-weight:600;font-size:13px}
.wok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.wno{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-color:transparent}
.wok:hover,.wno:hover{filter:brightness(1.05)}
.aicard{display:flex;flex-direction:column}
.ailist{flex:1;display:flex;flex-direction:column;gap:16px;max-height:520px;overflow-y:auto;padding:10px 4px 14px}
.aim{max-width:88%;font-size:13.5px;line-height:1.9;word-break:break-word}
.aim.a.err .md{color:var(--bad)}
.md{text-align:start}
.md>*:first-child{margin-top:0}
.md h3,.md h4,.md h5,.md h6{font-size:13.5px;font-weight:800;margin:14px 0 6px;color:var(--ink);letter-spacing:-.1px}
.md h5,.md h6{font-size:13px;color:var(--sub)}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 8px;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.md li{line-height:1.85}
.md strong{font-weight:700;color:var(--ink)}
.md code{font-family:ui-monospace,Consolas,monospace;background:var(--s2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12px;direction:ltr;unicode-bidi:embed}
.md pre{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;overflow-x:auto;direction:ltr;text-align:left;margin:0 0 8px;max-width:100%}
.md pre code{background:none;border:0;padding:0;font-size:12px;line-height:1.7}
.md blockquote{border-inline-start:3px solid var(--tint);background:var(--s2);border-radius:0 8px 8px 0;padding:8px 12px;margin:0 0 8px;color:var(--sub)}
.md hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.md a{color:var(--tint);text-decoration:underline;text-underline-offset:3px}
.mdtab{overflow-x:auto;margin:0 0 8px;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:300px}
.md th,.md td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--border);white-space:nowrap}
.md thead th{background:var(--s2);font-weight:700}
.md tr:last-child td{border-bottom:0}
.aim.u{align-self:flex-start;background:var(--tint);color:#fff;padding:9px 14px;border-radius:14px;border-end-start-radius:4px;font-weight:500}
.aim.u .msgatt{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.aim.u .msgatt span{font-size:10.5px;font-weight:500;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:2px 9px;opacity:.9}
.aim.a{align-self:flex-end;max-width:94%;color:var(--ink);padding:0 2px}
.aim.x{align-self:center;max-width:100%;background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);border-radius:99px;font-size:12px;padding:6px 13px}
.typing{animation:th 1.2s infinite;color:var(--sub);padding:2px}
@keyframes th{50%{opacity:.35}}
.aiempty{margin:auto;text-align:center;padding:44px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.aiempty .aieico{width:54px;height:54px;border-radius:15px;border:1px solid var(--border);background:var(--s2);color:var(--tint);display:flex;align-items:center;justify-content:center}
.aiempty .aieico .i{width:24px;height:24px}
.aiempty b{font-size:15px}
.aiempty p{color:var(--sub);font-size:12.5px;line-height:1.9;max-width:360px;margin:0}
.attrow{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 8px}
.attchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border:1px solid var(--border);border-radius:99px;padding:3px 6px 3px 12px;background:var(--s2);max-width:230px}
.attchip span, .attchip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attchip .ib{color:var(--sub)}
.aibar{display:flex;gap:4px;align-items:center;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:5px;margin-top:12px}
.aibar input{flex:1;min-width:0;border:0;background:transparent;min-height:36px;padding:0 8px;font-size:13.5px;font-weight:500}
.aibar input:focus{outline:none}
.inpib{width:36px;min-height:36px;border-radius:10px;flex:none;color:var(--sub)}
.inpib:hover{color:var(--ink)}
.inpib.pri{color:#fff}
#micb.on{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);animation:th 1.2s infinite}
.qamenu.up{top:auto;bottom:calc(100% + 8px);inset-inline-end:auto;inset-inline-start:0}
.aiwarn{color:var(--warn);font-size:12.5px;margin-top:10px}
@media(max-width:599px){
 .ailist{max-height:calc(100dvh - 300px);min-height:220px;gap:14px;padding:6px 0 10px}
 .aim{max-width:94%}
 .aim.a{max-width:100%}
 .aibar{gap:2px;padding:4px;border-radius:12px}
 .inpib{width:34px;min-height:34px;border-radius:9px}
 .aibar input{padding:0 5px;font-size:13px}
